<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-5">
        <h1>Welcome to My Responsive Webpage</h1>
        <p class="lead">This is a simple responsive webpage using Bootstrap and custom CSS.</p>
    </header>
    <main class="container my-5">
        <section>
            <h2>About</h2>
            <p>This section contains information about the webpage.</p>
        </section>
        <section>
            <h2>Gallery</h2>
            <div class="row">
                <div class="col-md-4">
                    <img src="assets/images/image1.jpg" class="img-fluid" alt="Image 1">
                </div>
                <div class="col-md-4">
                    <img src="assets/images/image2.jpg" class="img-fluid" alt="Image 2">
                </div>
                <div class="col-md-4">
                    <img src="assets/images/image3.jpg" class="img-fluid" alt="Image 3">
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2023 My Responsive Webpage</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
